name: Build Lenovo TB321FC BakaSU Kernel
run-name: ${{ inputs.releases }}

permissions:
  contents: read
  actions: write

on:
  workflow_dispatch:
    inputs:
      ksu_ref:
        description: "BakaSU branch"
        required: false
        default: 'sync-up'

      releases:
        description: "Kernel release"
        required: true
        type: choice
        options:
          - '6.1.124'
        default: '6.1.124'

      custom_kernel_suffix:
        description: "Kernel suffix"
        required: false
        default: ''

      custom_kernel_time:
        description: "Build timestamp"
        required: false
        default: ''

      kernel_module_impl:
        description: "Kernel module implementation"
        required: true
        type: choice
        options:
          - 'N/A'
          - 'KPN'
        default: 'N/A'

      enable_netfilter:
        description: "Netfilter support"
        required: true
        default: true
        type: boolean

      enable_bbr_ecn:
        description: "BBR+ECN support"
        required: true
        default: true
        type: boolean

      enable_unicode_bypass:
        description: "Fix Unicode invisible character bypass support"
        required: true
        default: true
        type: boolean

      enable_susfs:
        description: "SUSFS support"
        required: true
        default: true
        type: boolean

jobs:
  build:
    name: Build TB321FC ${{ inputs.releases }}
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      KSU_TYPE: BakaSU
      KSU_REPO: Baka-SU/BakaSU
      KSU_REF_INPUT: ${{ inputs.ksu_ref }}
      BUILD_TARGET: Build_Lenovo_TB321FC
      KERNEL_RELEASE: ${{ inputs.releases }}
      CUSTOM_KERNEL_SUFFIX: ${{ inputs.custom_kernel_suffix }}
      CUSTOM_KERNEL_TIME: ${{ inputs.custom_kernel_time }}
      KERNEL_MODULE_IMPL: ${{ inputs.kernel_module_impl }}
      STOCK_BUILD_USER: kleaf
      STOCK_BUILD_HOST: build-host
      STOCK_COMPILER_INFO: Android (11368308, +pgo, +bolt, +lto, +mlgo, based on r510928) clang version 18.0.0
      TOOLCHAIN_CACHE_ROOT: .toolchain-cache
      ENABLE_NETFILTER: ${{ inputs.enable_netfilter }}
      ENABLE_BBR_ECN: ${{ inputs.enable_bbr_ecn }}
      ENABLE_UNICODE_BYPASS: ${{ inputs.enable_unicode_bypass }}
      ENABLE_SUSFS: ${{ inputs.enable_susfs }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: 🔎 Resolve TB321FC release
        run: |
          set -euo pipefail

          # To support another release: add an option to the "releases" input above
          # and a matching case here (kernel version, stock suffix, stock build time).
          case "$KERNEL_RELEASE" in
            "6.1.124")
              kernel_version='6.1.124'
              default_suffix='-android14-11-gd53339245194-ab13005711'
              default_kernel_time='Tue Feb  4 01:50:08 UTC 2025'
              ;;
            *)
              echo "::error::Unsupported TB321FC release: $KERNEL_RELEASE"
              exit 1
              ;;
          esac

          {
            echo "KERNEL_VERSION=$kernel_version"
            echo "DEFAULT_SUFFIX=$default_suffix"
            echo "DEFAULT_KERNEL_TIME=$default_kernel_time"
          } >> "$GITHUB_ENV"
          echo "Release $KERNEL_RELEASE -> kernel $kernel_version ($default_suffix)"

      - name: ⚙️ Set Kernel version config
        run: |
          if [ -z "$KERNEL_VERSION" ]; then
            echo "::error::KERNEL_VERSION was not provided by the caller workflow"
            exit 1
          fi
          if [ -z "$DEFAULT_SUFFIX" ]; then
            echo "::error::DEFAULT_SUFFIX was not provided by the caller workflow"
            exit 1
          fi
          if [ -z "$DEFAULT_KERNEL_TIME" ]; then
            echo "::error::DEFAULT_KERNEL_TIME was not provided by the caller workflow"
            exit 1
          fi

          echo "KERNEL_VERSION=$KERNEL_VERSION" >> $GITHUB_ENV

          KERNEL_SERIES="${KERNEL_VERSION%.*}"
          AOSP_COMMIT_PREFIX="$(printf '%s\n' "$DEFAULT_SUFFIX" | sed -nE 's/.*-g([0-9a-fA-F]+)-.*/\1/p' | tr 'A-F' 'a-f')"
          if [ -z "$AOSP_COMMIT_PREFIX" ]; then
            echo "::error::Failed to extract the AOSP commit hash from DEFAULT_SUFFIX='$DEFAULT_SUFFIX'"
            exit 1
          fi

          COMMON_AOSP_TAG="$(
            git ls-remote --tags https://android.googlesource.com/kernel/common "refs/tags/android*-${KERNEL_SERIES}-*" |
              awk -v hash="$AOSP_COMMIT_PREFIX" '
                $1 ~ "^" hash {
                  ref = $2
                  sub(/\^\{\}$/, "", ref)
                  sub(/^refs\/tags\//, "", ref)
                  print ref
                }
              ' |
              sort -Vr |
              head -n 1
          )"
          if [ -z "$COMMON_AOSP_TAG" ]; then
            echo "::error::No AOSP tag found for kernel series '$KERNEL_SERIES' and commit prefix '$AOSP_COMMIT_PREFIX'"
            exit 1
          fi

          os_patch_level="$(printf '%s\n' "$COMMON_AOSP_TAG" | sed -nE 's/^android[0-9]+-[0-9]+\.[0-9]+-([0-9]{4}-[0-9]{2})_r[0-9]+$/\1/p')"
          if [ -z "$os_patch_level" ]; then
            echo "::error::Failed to derive os_patch_level from COMMON_AOSP_TAG='$COMMON_AOSP_TAG'"
            exit 1
          fi

          echo "Resolved AOSP commit prefix: $AOSP_COMMIT_PREFIX"
          echo "Resolved COMMON_AOSP_TAG: $COMMON_AOSP_TAG"
          echo "os_patch_level=$os_patch_level" >> $GITHUB_ENV
          echo "COMMON_AOSP_TAG=$COMMON_AOSP_TAG" >> $GITHUB_ENV
          echo "AOSP_COMMIT_PREFIX=$AOSP_COMMIT_PREFIX" >> $GITHUB_ENV

          if [ -z "$CUSTOM_KERNEL_SUFFIX" ]; then
            echo "DEFAULT_SUFFIX=$DEFAULT_SUFFIX" >> $GITHUB_ENV
            echo "Using stock kernel name: $DEFAULT_SUFFIX"
          else
            echo "Using custom name: $CUSTOM_KERNEL_SUFFIX"
            echo "DEFAULT_SUFFIX=$CUSTOM_KERNEL_SUFFIX" >> $GITHUB_ENV
          fi
          if [ -z "$CUSTOM_KERNEL_TIME" ]; then
            KERNEL_TIME="$DEFAULT_KERNEL_TIME"
            echo "KERNEL_TIME=$KERNEL_TIME" >> $GITHUB_ENV
            echo "Using stock kernel time: $KERNEL_TIME"
          else
            echo "Using custom build time: $CUSTOM_KERNEL_TIME"
            echo "KERNEL_TIME=$CUSTOM_KERNEL_TIME" >> $GITHUB_ENV
          fi

      - name: 📥 Restore toolchain cache
        id: toolchain-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ${{ env.TOOLCHAIN_CACHE_ROOT }}/clang18
            ${{ env.TOOLCHAIN_CACHE_ROOT }}/build-tools
          key: toolchain-clang-r510928-build-tools-r510928-v1

      - name: 🛠 Install dependencies, initialize repo, and sync
        run: |
          rm -rf kernel_workspace
          mkdir kernel_workspace
          mkdir -p "${{ env.TOOLCHAIN_CACHE_ROOT }}"
          cd kernel_workspace

          # Every background job is tracked so a failed download fails this step
          # instead of surfacing later as a confusing build error.
          PIDS=()
          NAMES=()
          track() { PIDS+=("$!"); NAMES+=("$1"); }

          (
            sudo apt-mark hold firefox &&
            sudo apt-mark hold libc-bin &&
            sudo apt-get purge -y man-db &&
            sudo rm -rf /var/lib/man-db/auto-update &&
            sudo apt-get update &&
            sudo apt-get install -y --no-install-recommends binutils python-is-python3 libssl-dev libelf-dev p7zip-full zstd
          ) &
          track "apt dependencies"

          (
            wget -q https://github.com/cctv18/oppo_oplus_realme_sm8650/raw/refs/heads/main/lib/ccache-x86-64 -O ccache &&
            sudo cp -f ./ccache /usr/bin/ccache &&
            sudo chmod +x /usr/bin/ccache &&
            rm -f ./ccache
          ) &
          track "ccache binary"

          # The +archive endpoint on android.googlesource.com streams the tarball without a
          # Content-Length and was cut off mid-download (aria2 still reported success, tar then
          # failed on a truncated file). The GitHub mirror is fast on runners, and the commit
          # hash is checked so the tree is guaranteed to be the exact stock commit.
          echo "Cloning source repository..."
          COMMON_MIRROR_URL="https://github.com/aosp-mirror/kernel_common.git"
          echo "Source: $COMMON_MIRROR_URL @ ${COMMON_AOSP_TAG} (expect commit ${AOSP_COMMIT_PREFIX}...)"
          (
            for i in 1 2 3; do
              rm -rf common
              if git clone -q --depth=1 --branch "${COMMON_AOSP_TAG}" "$COMMON_MIRROR_URL" common; then
                actual_commit="$(git -C common rev-parse HEAD)"
                case "$actual_commit" in
                  "${AOSP_COMMIT_PREFIX}"*)
                    echo "Kernel source OK: $actual_commit"
                    rm -rf common/.git
                    exit 0
                    ;;
                esac
                echo "Cloned commit $actual_commit does not match expected prefix ${AOSP_COMMIT_PREFIX}."
              fi
              echo "Source clone failed (attempt $i)."
              if [ "$i" -lt 3 ]; then sleep 20; fi
            done
            exit 1
          ) &
          track "kernel source"

          if [ -d "../${{ env.TOOLCHAIN_CACHE_ROOT }}/clang18/bin" ]; then
            echo "Restoring cached llvm-clang18 toolchain..."
            cp -a "../${{ env.TOOLCHAIN_CACHE_ROOT }}/clang18" ./clang18 &
          else
            echo "Cloning llvm-clang18 toolchain..."
            (
              mkdir -p clang18 &&
              aria2c -s16 -x16 -k1M https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang18-r510928/clang-r510928.zip -o clang.zip &&
              unzip -q clang.zip -d clang18 &&
              rm -rf clang.zip
            ) &
          fi
          track "clang18 toolchain"

          if [ -d "../${{ env.TOOLCHAIN_CACHE_ROOT }}/build-tools/bin" ]; then
            echo "Restoring cached build tools..."
            cp -a "../${{ env.TOOLCHAIN_CACHE_ROOT }}/build-tools" ./build-tools &
          else
            echo "Cloning build tools..."
            (
              aria2c -s16 -x16 -k1M https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang18-r510928/build-tools.zip -o build-tools.zip &&
              unzip -q build-tools.zip &&
              rm -rf build-tools.zip
            ) &
          fi
          track "build tools"

          FAILED=0
          for idx in "${!PIDS[@]}"; do
            if ! wait "${PIDS[$idx]}"; then
              echo "::error::Background job failed: ${NAMES[$idx]}"
              FAILED=1
            fi
          done
          [ "$FAILED" -eq 0 ] || exit 1

          if [ ! -d "../${{ env.TOOLCHAIN_CACHE_ROOT }}/clang18/bin" ] && [ -d "clang18/bin" ]; then
            rm -rf "../${{ env.TOOLCHAIN_CACHE_ROOT }}/clang18"
            cp -a clang18 "../${{ env.TOOLCHAIN_CACHE_ROOT }}/clang18"
          fi
          if [ ! -d "../${{ env.TOOLCHAIN_CACHE_ROOT }}/build-tools/bin" ] && [ -d "build-tools/bin" ]; then
            rm -rf "../${{ env.TOOLCHAIN_CACHE_ROOT }}/build-tools"
            cp -a build-tools "../${{ env.TOOLCHAIN_CACHE_ROOT }}/build-tools"
          fi
          echo "All sources and the llvm-Clang18 toolchain have been initialized!"
          echo "Removing ABI protection files and the dirty suffix..."
          rm common/android/abi_gki_protected_exports_* || true
          for f in common/scripts/setlocalversion; do
            sed -i 's/ -dirty//g' "$f"
            sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' "$f"
          done

      - name: 📥 Save toolchain cache
        if: ${{ steps.toolchain-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: |
            ${{ env.TOOLCHAIN_CACHE_ROOT }}/clang18
            ${{ env.TOOLCHAIN_CACHE_ROOT }}/build-tools
          key: toolchain-clang-r510928-build-tools-r510928-v1

      - name: 🛠 Set ccache dir
        run: |
          ROOT_SOLUTION_KEY="${{ env.KSU_TYPE }}"
          echo "ROOT_SOLUTION_KEY=$ROOT_SOLUTION_KEY" >> $GITHUB_ENV
          echo "CCACHE_KEY=ccache-ECS-${ROOT_SOLUTION_KEY}-${KERNEL_VERSION}" >> $GITHUB_ENV
          echo "CCACHE_DIR=$HOME/.ccache_${ROOT_SOLUTION_KEY}_${KERNEL_VERSION}" >> $GITHUB_ENV
          echo "CCACHE_MAXSIZE=10G" >> $GITHUB_ENV
          echo "Current disk space:"
          df -h
          echo "Kernel version being built: $KERNEL_VERSION"

      - name: 🛠 Set build identity
        working-directory: kernel_workspace/common
        run: |
          set -e
          if [ -f "scripts/mkcompile_h" ]; then
            if grep -q "LINUX_COMPILE_BY=" scripts/mkcompile_h; then
              sed -i "s|LINUX_COMPILE_BY=.*|LINUX_COMPILE_BY=\"${{ env.STOCK_BUILD_USER }}\"|" scripts/mkcompile_h
              sed -i "s|LINUX_COMPILE_HOST=.*|LINUX_COMPILE_HOST=\"${{ env.STOCK_BUILD_HOST }}\"|" scripts/mkcompile_h
            fi
            if grep -q "LINUX_COMPILER=" scripts/mkcompile_h; then
              sed -i "s|LINUX_COMPILER=.*|LINUX_COMPILER=\"${{ env.STOCK_COMPILER_INFO }}\"|" scripts/mkcompile_h
            fi
          fi
          echo "KBUILD_BUILD_USER=${{ env.STOCK_BUILD_USER }}" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_HOST=${{ env.STOCK_BUILD_HOST }}" >> "$GITHUB_ENV"
          echo "Using build user: ${{ env.STOCK_BUILD_USER }}"
          echo "Using build host: ${{ env.STOCK_BUILD_HOST }}"
          echo "Using compiler info: ${{ env.STOCK_COMPILER_INFO }}"

      - name: 📥 Restore ccache
        id: ccache-restore
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ env.CCACHE_KEY }}-latest
          restore-keys: |
            ${{ env.CCACHE_KEY }}-

      - name: 🔎 Find public ccache in releases
        id: public-ccache
        if: ${{ steps.ccache-restore.outputs.cache-matched-key == '' }}
        uses: actions/github-script@v9
        env:
          PUBLIC_CACHE_REPO: ${{ vars.PUBLIC_CACHE_REPO }}
          PUBLIC_CACHE_TAG: ${{ vars.PUBLIC_CACHE_TAG }}
        with:
          script: |
            const repoName = process.env.PUBLIC_CACHE_REPO || 'showdo/Public_Ccache';
            const releaseTag = process.env.PUBLIC_CACHE_TAG || 'exported-ccaches';
            const [owner, repo] = repoName.split('/');
            const deviceName = process.env.KERNEL_VERSION;
            let selected = null;

            const escape_regex = (value) => value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const exactAssetName = `ccache-${deviceName}.tar.zst`;
            const legacyAssetPattern = new RegExp(`^ccache-(.+-)?${escape_regex(deviceName)}(-[0-9]+)?\\.tar\\.zst$`);

            core.info(`No matching ccache found in the current repository. Searching public cache by device: ${deviceName}`);
            core.info(`Cache source repository: ${owner}/${repo}`);
            core.info(`Cache source tag: ${releaseTag}`);
            core.info(`Preferred public cache asset: ${exactAssetName}`);

            let release;
            try {
              const response = await github.rest.repos.getReleaseByTag({
                owner,
                repo,
                tag: releaseTag,
              });
              release = response.data;
            } catch (error) {
              core.info(`Public cache release not found: ${releaseTag}`);
              return;
            }

            for (const asset of release.assets || []) {
              const isExactMatch = asset.name === exactAssetName;
              const isLegacyMatch = legacyAssetPattern.test(asset.name);
              if (isExactMatch || isLegacyMatch) {
                const shouldReplace =
                  !selected ||
                  (isExactMatch && !selected.exact) ||
                  (isExactMatch === selected.exact && new Date(asset.updated_at) > new Date(selected.updated_at));

                if (shouldReplace) {
                  selected = {
                    name: asset.name,
                    updated_at: asset.updated_at,
                    tag: release.tag_name,
                    repo: `${owner}/${repo}`,
                    exact: isExactMatch,
                  };
                }
              }
            }

            if (!selected) {
              core.info('No usable public ccache asset found. Continuing with an empty cache.');
              return;
            }

            core.info(`Found public cache: ${selected.name} (${selected.repo}@${selected.tag})`);
            core.setOutput('asset-name', selected.name);
            core.setOutput('release-tag', selected.tag);
            core.setOutput('source-repo', selected.repo);

      - name: 📦 Restore public ccache from releases
        if: ${{ steps.ccache-restore.outputs.cache-matched-key == '' && steps.public-ccache.outputs.asset-name != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_CACHE_REPO: ${{ steps.public-ccache.outputs.source-repo }}
          PUBLIC_CACHE_TAG: ${{ steps.public-ccache.outputs.release-tag }}
          PUBLIC_CACHE_ASSET: ${{ steps.public-ccache.outputs.asset-name }}
        run: |
          set -euo pipefail
          echo "No matching cache found in the current repository. Downloading public cache: $PUBLIC_CACHE_ASSET"
          rm -f "$PUBLIC_CACHE_ASSET"
          rm -rf "$CCACHE_DIR"
          gh release download "$PUBLIC_CACHE_TAG" --repo "$PUBLIC_CACHE_REPO" --pattern "$PUBLIC_CACHE_ASSET" --dir .
          TEMP_EXTRACT_DIR="$(mktemp -d)"
          tar --use-compress-program=unzstd -xf "$PUBLIC_CACHE_ASSET" -C "$TEMP_EXTRACT_DIR"
          EXTRACTED_CCACHE_DIR="$(find "$TEMP_EXTRACT_DIR" -maxdepth 1 -mindepth 1 -type d -name '.ccache_*' | head -n 1)"
          if [ -z "$EXTRACTED_CCACHE_DIR" ]; then
            echo "::error::No .ccache_* directory found after extracting the public cache"
            exit 1
          fi

          mkdir -p "$CCACHE_DIR"
          shopt -s dotglob nullglob
          mv "$EXTRACTED_CCACHE_DIR"/* "$CCACHE_DIR"/
          shopt -u dotglob nullglob
          rm -rf "$TEMP_EXTRACT_DIR"
          test -d "$CCACHE_DIR"
          ls -lah "$CCACHE_DIR" | head -n 20
          echo "PUBLIC_CCACHE_USED=true" >> "$GITHUB_ENV"
          echo "Public cache restore completed: $CCACHE_DIR"

      - name: 📥 Init ccache
        run: |
          # Set ccache environment variables
          export CCACHE_COMPILERCHECK="none"
          export CCACHE_BASEDIR="${{ github.workspace }}"
          export CCACHE_NOHASHDIR="true"
          export CCACHE_NOHARDLINK="true"
          export CCACHE_DIR="${{ env.CCACHE_DIR }}"
          export CCACHE_MAXSIZE="${{ env.CCACHE_MAXSIZE }}"

          # Ensure the ccache directory exists
          mkdir -p "$CCACHE_DIR"

          # Reconfigure cache size on every run
          echo "Configuring ccache max size: $CCACHE_MAXSIZE"
          ccache -M "$CCACHE_MAXSIZE"
          ccache -o compression=true

          # Show initial cache status
          echo "Initial ccache status:"
          ccache -s

          # Show detailed info when cache restore hits
          if [ -n "${{ steps.ccache-restore.outputs.cache-matched-key }}" ]; then
            echo "ccache hit details: ${{ steps.ccache-restore.outputs.cache-matched-key }}"
            ccache -sv
          elif [ "${PUBLIC_CCACHE_USED:-false}" = 'true' ]; then
            echo "Public ccache restored. Current cache details:"
            ccache -sv
          else
            echo "No repository cache hit and no public cache found. Building with an empty cache."
          fi

      - name: ⚙️ Set BakaSU
        run: |
          cd kernel_workspace
          KSU_SETUP_REF="${KSU_REF_INPUT:-main}"
          echo "Configuring BakaSU from ${KSU_REPO}@${KSU_SETUP_REF}..."
          curl -fLSs "https://raw.githubusercontent.com/${KSU_REPO}/${KSU_SETUP_REF}/kernel/setup.sh" | bash -s "$KSU_SETUP_REF"
          # setup.sh clones BakaSU (full history) into ./KernelSU and links it to drivers/kernelsu
          cd ./KernelSU
          # Mirrors kernel/Kbuild: KSU_VERSION = 30000 + rev-list count + 700
          KSU_LOCAL_COUNT="$(git rev-list --count HEAD)"
          KSU_VERSION=$((30700 + KSU_LOCAL_COUNT))
          KSU_COMMIT_SHA="$(git rev-parse HEAD)"
          echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
          echo "KSU_COMMIT_SHA=$KSU_COMMIT_SHA" >> $GITHUB_ENV
          echo "BakaSU version: $KSU_VERSION"
          echo "BakaSU commit: $KSU_COMMIT_SHA"

      - name: 🔍 Check SUSFS priority UID filter support
        if: ${{ env.ENABLE_SUSFS == 'true' }}
        run: |
          # Read-only: inspects the BakaSU checkout and never modifies it.
          set -euo pipefail
          cd kernel_workspace/KernelSU

          # BakaSU history around KSU_SUSFS_PRIORITY_UID_FILTER:
          #   FIRST_BROKEN  first commit that calls the two priority-UID-filter functions
          #                 without declaring the symbol (inclusive)
          #   FIRST_FIXED   first commit where BakaSU defines the symbol itself
          # A ref in [FIRST_BROKEN, FIRST_FIXED) compiles fine and then fails at the link
          # step, so stop here instead of after the full compile.
          FIRST_BROKEN="67b5645"
          FIRST_FIXED="dc8e01e"
          SYMBOL="KSU_SUSFS_PRIORITY_UID_FILTER"

          HEAD_SHORT="$(git rev-parse --short=8 HEAD)"
          echo "BakaSU checkout: ${HEAD_SHORT}"

          has_commit() { git cat-file -e "$1^{commit}" 2>/dev/null; }
          # True when $1 is HEAD itself or one of its ancestors.
          in_history() { git merge-base --is-ancestor "$1" HEAD 2>/dev/null; }

          # Where does this ref define the symbol?
          IN_KCONFIG=false
          IN_KBUILD=false
          if [ -f kernel/Kconfig ] && grep -Eq '^[[:space:]]*config[[:space:]]+'"$SYMBOL"'([[:space:]]|$)' kernel/Kconfig; then
            IN_KCONFIG=true
          fi
          if grep -qs "$SYMBOL" kernel/Kbuild kernel/Makefile; then
            IN_KBUILD=true
          fi

          # Where does this ref sit relative to the broken range?
          RANGE_CHECKED=false
          IN_BROKEN_RANGE=false
          if [ "$(git rev-parse --is-shallow-repository)" != true ] && has_commit "$FIRST_BROKEN" && has_commit "$FIRST_FIXED"; then
            RANGE_CHECKED=true
            if in_history "$FIRST_BROKEN" && ! in_history "$FIRST_FIXED"; then
              IN_BROKEN_RANGE=true
            fi
          fi

          if [ "$IN_KCONFIG" = true ]; then
            echo "OK: BakaSU ${HEAD_SHORT} defines ${SYMBOL} in kernel/Kconfig:"
            awk -v sym="$SYMBOL" '
              $1 == "config" && $2 == sym { found = 1; print; next }
              found && /^[^ \t]/ { exit }
              found { print }
            ' kernel/Kconfig
          elif [ "$IN_KBUILD" = true ]; then
            echo "::warning::${SYMBOL} is set in kernel/Kbuild or kernel/Makefile but not declared in kernel/Kconfig, so it is a build-time define. The CONFIG_${SYMBOL} line in gki_defconfig has no effect on this ref."
            grep -ns "$SYMBOL" kernel/Kbuild kernel/Makefile || true
          elif [ "$IN_BROKEN_RANGE" = true ]; then
            echo "::error title=BakaSU ref is in the broken range::BakaSU ${HEAD_SHORT} is between ${FIRST_BROKEN} and ${FIRST_FIXED}: it calls the two SUSFS priority-UID-filter functions but does not declare ${SYMBOL}, so the kernel would compile and then fail at the link step. Use ${FIRST_FIXED} or newer (for example ksu_ref=sync-up), or a ref older than ${FIRST_BROKEN}."
            exit 1
          elif [ "$RANGE_CHECKED" != true ]; then
            echo "::warning::${SYMBOL} is not defined in this BakaSU ref and its position relative to ${FIRST_BROKEN}/${FIRST_FIXED} could not be determined (shallow clone or commits not found). If the build fails at the link step, this ref is probably in the broken range."
          elif in_history "$FIRST_FIXED"; then
            echo "::warning::BakaSU ${HEAD_SHORT} is newer than ${FIRST_FIXED} but no longer defines ${SYMBOL} (renamed or removed upstream?). The CONFIG_${SYMBOL} line in gki_defconfig will be ignored."
          else
            echo "::notice::BakaSU ${HEAD_SHORT} predates the SUSFS priority UID filter, so ${SYMBOL} is not available. The CONFIG_${SYMBOL} line in gki_defconfig will be ignored (Kconfig warns about the unknown symbol and the build continues)."
          fi

      - name: 🔧 Set up SUSFS
        if: ${{ env.ENABLE_SUSFS == 'true' }}
        run: |
          cd kernel_workspace
          SUSFS_REPO="https://gitlab.com/simonpunk/susfs4ksu.git"
          SUSFS_BRANCH="gki-android14-6.1"
          SUSFS_PATCH="50_add_susfs_in_gki-android14-6.1.patch"
          git clone --depth=1 "$SUSFS_REPO" susfs4ksu -b "$SUSFS_BRANCH"
          SUSFS_DIR="${PWD}/susfs4ksu"
          cp "${SUSFS_DIR}/kernel_patches/${SUSFS_PATCH}" ./common/
          cp "${SUSFS_DIR}/kernel_patches/fs/"* ./common/fs/
          cp "${SUSFS_DIR}/kernel_patches/include/linux/"* ./common/include/linux/
          cd ./common
          # The patch's include hunks expect two #include lines that Google's android14-6.1
          # tree does not have (checked against android14-6.1-2025-02_r1). Add them only so the
          # hunks match, then remove them again so the tree keeps its original includes.
          added_blk=0
          added_dmabuf=0
          if ! grep -qxF '#include <trace/hooks/blk.h>' ./fs/namespace.c; then
            echo "Missing <trace/hooks/blk.h> in fs/namespace.c. Adding temporary include for SUSFS patch."
            sed -i '/^#include "internal.h"$/a #include <trace/hooks/blk.h>' ./fs/namespace.c
            added_blk=1
          fi
          if ! grep -qxF '#include <linux/dma-buf.h>' ./fs/proc/base.c; then
            echo "Missing <linux/dma-buf.h> in fs/proc/base.c. Adding temporary include for SUSFS patch."
            sed -i '/^#include <linux\/cpufreq_times.h>$/a #include <linux/dma-buf.h>' ./fs/proc/base.c
            added_dmabuf=1
          fi
          patch -p1 < "$SUSFS_PATCH" || true
          if [ "$added_blk" = 1 ]; then
            sed -i '/^#include <trace\/hooks\/blk.h>$/d' ./fs/namespace.c
          fi
          if [ "$added_dmabuf" = 1 ]; then
            sed -i '/^#include <linux\/dma-buf.h>$/d' ./fs/proc/base.c
          fi
          # A half-applied SUSFS patch builds a broken kernel, so stop here instead of warning.
          REJECTS="$(find . -name '*.rej' -newer "$SUSFS_PATCH" 2>/dev/null || true)"
          if [ -n "$REJECTS" ]; then
            echo "::error::SUSFS patch left rejected hunks: $(echo "$REJECTS" | tr '\n' ' ')"
            exit 1
          fi

      - name: 🔧 Set gki_defconfig
        run: |
          cd kernel_workspace
          DEFCONFIG=./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU=y" >> "$DEFCONFIG"

          if [ "${{ env.ENABLE_SUSFS }}" = 'true' ]; then
            # Only the SUSFS options that BakaSU's kernel/Kconfig defines.
            # PRIORITY_UID_FILTER is defined by BakaSU itself from dc8e01e on; the line only
            # states the intent (redundant if Kconfig already defaults it to y). The
            # "Check SUSFS priority UID filter support" step above reports whether the ref has it.
            {
              echo "CONFIG_KSU_SUSFS=y"
              echo "CONFIG_KSU_SUSFS_SUS_PATH=y"
              echo "CONFIG_KSU_SUSFS_SUS_MAP=y"
              echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y"
              echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y"
              echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y"
              echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y"
              echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y"
              echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y"
              echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y"
              echo "CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER=y"
            } >> "$DEFCONFIG"
          fi

          echo "CONFIG_TMPFS_XATTR=y" >> "$DEFCONFIG"
          echo "CONFIG_TMPFS_POSIX_ACL=y" >> "$DEFCONFIG"

          if [ "${{ env.ENABLE_BBR_ECN }}" = 'true' ]; then
            {
              echo "CONFIG_TCP_CONG_ADVANCED=y"
              echo "CONFIG_TCP_CONG_BBR=y"
              echo "CONFIG_NET_SCH_FQ=y"
              echo "CONFIG_TCP_CONG_BIC=n"
              echo "CONFIG_TCP_CONG_WESTWOOD=n"
              echo "CONFIG_TCP_CONG_HTCP=n"
              echo "CONFIG_IP_ECN=y"
              echo "CONFIG_TCP_ECN=y"
              echo "CONFIG_IPV6_ECN=y"
              echo "CONFIG_IP_NF_TARGET_ECN=y"
            } >> "$DEFCONFIG"
          fi

          if [ "${{ env.ENABLE_NETFILTER }}" = 'true' ]; then
            {
              echo "CONFIG_BPF_STREAM_PARSER=y"
              echo "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y"
              echo "CONFIG_NETFILTER_XT_SET=y"
              echo "CONFIG_IP_SET=y"
              echo "CONFIG_IP_SET_MAX=65534"
              echo "CONFIG_IP_SET_BITMAP_IP=y"
              echo "CONFIG_IP_SET_BITMAP_IPMAC=y"
              echo "CONFIG_IP_SET_BITMAP_PORT=y"
              echo "CONFIG_IP_SET_HASH_IP=y"
              echo "CONFIG_IP_SET_HASH_IPMARK=y"
              echo "CONFIG_IP_SET_HASH_IPPORT=y"
              echo "CONFIG_IP_SET_HASH_IPPORTIP=y"
              echo "CONFIG_IP_SET_HASH_IPPORTNET=y"
              echo "CONFIG_IP_SET_HASH_IPMAC=y"
              echo "CONFIG_IP_SET_HASH_MAC=y"
              echo "CONFIG_IP_SET_HASH_NETPORTNET=y"
              echo "CONFIG_IP_SET_HASH_NET=y"
              echo "CONFIG_IP_SET_HASH_NETNET=y"
              echo "CONFIG_IP_SET_HASH_NETPORT=y"
              echo "CONFIG_IP_SET_HASH_NETIFACE=y"
              echo "CONFIG_IP_SET_LIST_SET=y"
              echo "CONFIG_IP6_NF_NAT=y"
              echo "CONFIG_IP6_NF_TARGET_MASQUERADE=y"
            } >> "$DEFCONFIG"
          fi

          echo "CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y" >> "$DEFCONFIG"

          #Remove check_defconfig
          sudo sed -i 's/check_defconfig//' ./common/build.config.gki

      - name: 🔧 Apply Netfilter config compatibility patch
        if: ${{ env.ENABLE_NETFILTER == 'true' }}
        run: |
          cd kernel_workspace/common
          wget https://raw.githubusercontent.com/cctv18/oppo_oplus_realme_sm8650/main/other_patch/config.patch -O config.patch
          patch -p1 -F 3 < config.patch || true
          rm -f config.patch

      - name: 🔧 Apply Unicode Bypass patch
        if: ${{ env.ENABLE_UNICODE_BYPASS == 'true' }}
        run: |
          cd kernel_workspace/common
          wget https://raw.githubusercontent.com/Numbersf/Action-Build/SukiSU-Ultra/patches/unicode_bypass_fix_6.1%2B.patch -O unicode_bypass_fix_6.1+.patch
          patch -p1 --forward < unicode_bypass_fix_6.1+.patch || true
          rm -f unicode_bypass_fix_6.1+.patch

      - name: 🔧 Set kernel name
        run: |
          cd kernel_workspace
          echo "Kernel suffix: $DEFAULT_SUFFIX"
          # android14-6.1's gki_defconfig has no "-4k" CONFIG_LOCALVERSION to replace, so make
          # scripts/setlocalversion print the suffix as-is. uname -r = <version><suffix>.
          if ! printf '%s' "$DEFAULT_SUFFIX" | grep -qE '^[A-Za-z0-9._+-]+$'; then
            echo "::error::Kernel suffix may only contain letters, digits and . _ + - (got '$DEFAULT_SUFFIX')"
            exit 1
          fi
          f=./common/scripts/setlocalversion
          if [ "$(tail -n 1 "$f")" != 'echo "$res"' ]; then
            echo "::error::Unexpected last line in $f: $(tail -n 1 "$f")"
            exit 1
          fi
          sed -i '$d' "$f"
          printf 'echo "%s"\n' "$DEFAULT_SUFFIX" >> "$f"

      - name: 📥 Start build timer
        run:
          echo "BUILD_START=$(date +%s)" >> $GITHUB_ENV

      - name: 🔨 Build kernel
        run: |
          WORKDIR="$(pwd)"
          export PATH="/usr/lib/ccache:$PATH"
          export PATH="$WORKDIR/kernel_workspace/clang18/bin:$PATH"
          export PATH="$WORKDIR/kernel_workspace/build-tools/bin:$PATH"
          CLANG_DIR="$WORKDIR/kernel_workspace/clang18/bin"
          CLANG_VERSION="$($CLANG_DIR/clang --version | head -n 1)"
          LLD_VERSION="$($CLANG_DIR/ld.lld --version | head -n 1)"
          echo "Compiler info:"
          echo "Clang version: $CLANG_VERSION"
          echo "LLD version: $LLD_VERSION"
          pahole_version=$(pahole --version 2>/dev/null | head -n1); [ -z "$pahole_version" ] && echo "pahole version: not installed" || echo "pahole version: $pahole_version"

          export CCACHE_LOGFILE="${{ github.workspace }}/kernel_workspace/ccache.log"
          export CCACHE_COMPILERCHECK="none"
          export CCACHE_BASEDIR="${{ github.workspace }}"
          export CCACHE_NOHASHDIR="true"
          export CCACHE_NOHARDLINK="true"
          export CCACHE_DIR="${{ env.CCACHE_DIR }}"
          export CCACHE_MAXSIZE="${{ env.CCACHE_MAXSIZE }}"
          export CCACHE_IS_KERNEL_COMPILING="true"
          SLOPPINESS="sloppiness = file_stat_matches,include_file_ctime,include_file_mtime,pch_defines,file_macro,time_macros"
          grep -qxF "$SLOPPINESS" "$CCACHE_DIR/ccache.conf" 2>/dev/null || echo "$SLOPPINESS" >> "$CCACHE_DIR/ccache.conf"

          cd kernel_workspace/common
          wget https://github.com/cctv18/oppo_oplus_realme_sm8650/raw/refs/heads/main/lib/libfakestat.so
          wget https://github.com/cctv18/oppo_oplus_realme_sm8650/raw/refs/heads/main/lib/libfaketimeMT.so
          chmod 777 ./*.so
          export FAKESTAT="2025-05-25 12:00:00"
          export FAKETIME="@2025-05-25 13:00:00"
          echo "FAKESTAT=$FAKESTAT" >> $GITHUB_ENV
          echo "FAKETIME=$FAKETIME" >> $GITHUB_ENV
          SO_DIR=$(pwd)
          export PRELOAD_LIBS="$SO_DIR/libfakestat.so $SO_DIR/libfaketimeMT.so"
          export KBUILD_BUILD_USER="${{ env.STOCK_BUILD_USER }}"
          export KBUILD_BUILD_HOST="${{ env.STOCK_BUILD_HOST }}"
          # Create the CC (compiler) wrapper
          echo '#!/bin/bash' > cc-wrapper
          echo 'export LD_PRELOAD="'$PRELOAD_LIBS'"' >> cc-wrapper
          echo 'export FAKESTAT="'$FAKESTAT'"' >> cc-wrapper
          echo 'export FAKETIME="'$FAKETIME'"' >> cc-wrapper
          echo 'ccache clang "$@"' >> cc-wrapper
          # Create the LD (linker) wrapper
          echo '#!/bin/bash' > ld-wrapper
          echo 'export LD_PRELOAD="'$PRELOAD_LIBS'"' >> ld-wrapper
          echo 'export FAKESTAT="'$FAKESTAT'"' >> ld-wrapper
          echo 'export FAKETIME="'$FAKETIME'"' >> ld-wrapper
          echo 'ld.lld "$@"' >> ld-wrapper

          # Verify that time hijacking works correctly
          echo "--- [Wrapper Test] Creating a generic time hijack test script ---"
          echo '#!/bin/bash' > test-wrapper.sh
          echo 'export LD_PRELOAD="'$PRELOAD_LIBS'"' >> test-wrapper.sh
          echo 'export FAKESTAT="'$FAKESTAT'"' >> test-wrapper.sh
          echo 'export FAKETIME="'$FAKETIME'"' >> test-wrapper.sh
          echo 'echo ">>> Wrapper internal environment check complete."' >> test-wrapper.sh
          echo 'exec "$@"' >> test-wrapper.sh # Execute all passed arguments
          chmod +x test-wrapper.sh
          echo "--- [Wrapper Test] Testing the date command ---"
          ./test-wrapper.sh date
          echo "--- [Wrapper Test] Testing the stat command ---"
          ./test-wrapper.sh stat ./Makefile
          echo "--- [Wrapper Test] Test completed ---"
          chmod +x cc-wrapper ld-wrapper
          echo "--- Pre-build environment time: $(LD_PRELOAD=$PRELOAD_LIBS date) ---"
          echo "--- Pre-build environment file timestamp: ---"
          LD_PRELOAD=$PRELOAD_LIBS stat ./Makefile

          export KBUILD_BUILD_TIMESTAMP="${KERNEL_TIME}"

          # Clear unnecessary .NET, Android NDK, Haskell, and CodeQL runtimes while the kernel builds to free space without blocking later steps
          sudo rm -rf /usr/share/dotnet &
          sudo rm -rf /usr/local/lib/android &
          sudo rm -rf /opt/ghc &
          sudo rm -rf /opt/hostedtoolcache/CodeQL &
          make -j$(nproc --all) LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC="ccache clang" HOSTCC="ccache clang" HOSTCXX="ccache clang++" LD="ld.lld" HOSTLD=ld.lld O=out KCFLAGS+=-O2 KCFLAGS+=-Wno-error gki_defconfig &&
          make -j$(nproc --all) LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC="$(pwd)/cc-wrapper" HOSTCC="ccache clang" HOSTCXX="ccache clang++" LD="$(pwd)/ld-wrapper" HOSTLD=ld.lld O=out KCFLAGS+=-O2 KCFLAGS+=-Wno-error Image

          # Secondary time hijack verification after the build
          echo "--- Post-build environment time: $(LD_PRELOAD=$PRELOAD_LIBS date) ---"
          echo "--- Post-build environment file timestamp: ---"
          LD_PRELOAD=$PRELOAD_LIBS stat ./Makefile
          echo "Kernel build completed!"
          echo "ccache status:"
          ccache -s
          echo "Disk space after build:"
          df -h

      - name: 🕒 Calculate build time
        run: |
          END=$(date +%s)
          TIME=$((END - BUILD_START))
          echo "BUILD_TIME=$TIME" >> $GITHUB_ENV
          echo "Build time: $TIME seconds"

      - name: 📥 Save ccache if needed
        if: ${{ env.BUILD_TIME > 480 || steps.ccache-restore.outputs.cache-matched-key == '' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ env.CCACHE_KEY }}-${{ github.run_id }}

      - name: 🧹 Clean old ccache
        if: env.BUILD_TIME > 480
        uses: actions/github-script@v9
        env:
          PREFIX: ${{ env.CCACHE_KEY }}
          CURRENT_KEY: ${{ env.CCACHE_KEY }}-${{ github.run_id }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const prefix = process.env.PREFIX;
            const currentKey = process.env.CURRENT_KEY;
            let page = 1;
            let deleted = 0;

            core.info('Build time exceeded 8 minutes. ccache has been saved.');
            core.info(`Cleaning old caches with matching prefix: ${prefix}`);

            while (true) {
              const response = await github.rest.actions.getActionsCacheList({
                owner,
                repo,
                per_page: 100,
                page,
              });

              const caches = response.data.actions_caches || [];
              if (caches.length === 0) {
                break;
              }

              for (const cache of caches) {
                if (cache.key.startsWith(prefix) && cache.key !== currentKey) {
                  core.info(`Deleting cache: ${cache.key} (ID: ${cache.id})`);
                  await github.rest.actions.deleteActionsCacheById({
                    owner,
                    repo,
                    cache_id: cache.id,
                  });
                  deleted++;
                }
              }

              if (caches.length < 100) {
                break;
              }
              page++;
            }

            core.info(`Old cache cleanup completed. Deleted ${deleted} caches.`);

      - name: 📦 Apply KPatch-Next (KPN)
        if: ${{ env.KERNEL_MODULE_IMPL == 'KPN' }}
        run: |
          echo "Applying kernel module implementation patch: KPN"
          cd kernel_workspace/common/out/arch/arm64/boot
          PATCH_TOOL_REPO="KernelSU-Next/KPatch-Next"
          PATCH_TOOL_RELEASE_JSON="$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${PATCH_TOOL_REPO}/releases/latest")"
          PATCH_TOOL_KPTOOLS_URL="$(printf '%s' "$PATCH_TOOL_RELEASE_JSON" | python3 -c "import json,sys; data=json.load(sys.stdin); print(next(asset['browser_download_url'] for asset in data['assets'] if asset['name'] == 'kptools-linux'))")"
          PATCH_TOOL_KPIMG_URL="$(printf '%s' "$PATCH_TOOL_RELEASE_JSON" | python3 -c "import json,sys; data=json.load(sys.stdin); print(next(asset['browser_download_url'] for asset in data['assets'] if asset['name'] == 'kpimg-linux'))")"
          curl -fLSs "$PATCH_TOOL_KPTOOLS_URL" -o ./kptools-linux
          curl -fLSs "$PATCH_TOOL_KPIMG_URL" -o ./kpimg-linux
          chmod +x ./kptools-linux ./kpimg-linux
          ./kptools-linux -p -i ./Image -k ./kpimg-linux -o ./oImage
          rm -f Image
          mv oImage Image

      - name: 📦 Rename image
        run: |
          cd kernel_workspace/common/out/arch/arm64/boot
          cp ./Image "./kernel"

      - name: 🏷️ Set kernel artifact name
        run: |
          AOSP_KERNEL_SERIES="$(printf '%s\n' "$COMMON_AOSP_TAG" | sed -E 's/^(android[0-9]+-[0-9]+\.[0-9]+).*/\1/')"
          if [ -z "$AOSP_KERNEL_SERIES" ]; then
            echo "::error::Failed to derive kernel series from COMMON_AOSP_TAG='$COMMON_AOSP_TAG'"
            exit 1
          fi
          KERNEL_BUNDLE_NAME="${ROOT_SOLUTION_KEY}_kernel-${AOSP_KERNEL_SERIES}"
          echo "KERNEL_BUNDLE_NAME=$KERNEL_BUNDLE_NAME" >> "$GITHUB_ENV"
          echo "Kernel artifact name: $KERNEL_BUNDLE_NAME"

      - name: 📦 Prepare kernel bundle
        run: |
          BUNDLE_DIR="${GITHUB_WORKSPACE}/kernel_workspace/upload_bundle"
          rm -rf "$BUNDLE_DIR"
          mkdir -p "$BUNDLE_DIR"
          cp kernel_workspace/common/out/arch/arm64/boot/kernel "$BUNDLE_DIR/kernel"

      - name: 📥 Download BakaSU manager APK
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          BUNDLE_DIR="${GITHUB_WORKSPACE}/kernel_workspace/upload_bundle"
          REPO="${KSU_REPO}"
          REF="main"
          ARTIFACT="Manager-release"
          COMMIT_SHA="${KSU_COMMIT_SHA}"

          find_artifact_url() {
            local runs_api="$1"
            local runs_json artifacts_json artifact_url
            local run_ids=()

            runs_json="$(curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$runs_api")"

            mapfile -t run_ids < <(printf '%s' "$runs_json" | python3 -c "import json,sys; data=json.load(sys.stdin); [print(run['id']) for run in data.get('workflow_runs', []) if 'manager' in (run.get('name','').lower())]")

            if [ "${#run_ids[@]}" -eq 0 ]; then
              return 1
            fi

            for run_id in "${run_ids[@]}"; do
              artifacts_json="$(curl -fsSL \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer $GITHUB_TOKEN" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${REPO}/actions/runs/${run_id}/artifacts")"

              artifact_url="$(printf '%s' "$artifacts_json" | TARGET_ARTIFACT="$ARTIFACT" python3 -c "import json,os,sys; data=json.load(sys.stdin); target=os.environ['TARGET_ARTIFACT']; print(next((artifact['archive_download_url'] for artifact in data.get('artifacts', []) if artifact.get('name') == target and not artifact.get('expired')), ''))")"
              if [ -n "$artifact_url" ]; then
                echo "Using artifact '$ARTIFACT' from run $run_id" >&2
                printf '%s' "$artifact_url"
                return 0
              fi
            done

            return 2
          }

          ARTIFACT_URL=""

          if [ -n "$COMMIT_SHA" ]; then
            ARTIFACT_URL="$(find_artifact_url "https://api.github.com/repos/${REPO}/actions/runs?head_sha=${COMMIT_SHA}&status=success&per_page=50" || true)"
          fi

          if [ -z "$ARTIFACT_URL" ]; then
            echo "::warning::Exact manager artifact not found for ${REPO} at commit ${COMMIT_SHA}. Falling back to latest successful '${REF}' branch run."
            ARTIFACT_URL="$(find_artifact_url "https://api.github.com/repos/${REPO}/actions/runs?branch=${REF}&status=success&per_page=50" || true)"
          fi

          if [ -z "$ARTIFACT_URL" ]; then
            echo "::error::Artifact '${ARTIFACT}' not found in successful manager workflow runs for ${REPO} (commit='${COMMIT_SHA}' ref='${REF}')"
            exit 1
          fi

          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$ARTIFACT_URL" -o manager_artifact.zip
          unzip -jo manager_artifact.zip "*.apk" -d "$BUNDLE_DIR"
          rm -f manager_artifact.zip

          APK_COUNT=$(find "$BUNDLE_DIR" -maxdepth 1 -type f -name "*.apk" | wc -l)
          if [ "$APK_COUNT" -eq 0 ]; then
            echo "::error::Manager APK was not downloaded"
            exit 1
          fi
          find "$BUNDLE_DIR" -maxdepth 1 -type f -printf "%f\n"

      - name: 📤 Upload kernel bundle
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.KERNEL_BUNDLE_NAME }}
          path: kernel_workspace/upload_bundle/*
