name: Build BakaSU Spoofed Manager (arm64)

# Builds the BakaSU manager app from source with a CUSTOM package name so that
# root detectors (e.g. Duck Detector) no longer match the default string
# "com.resukisu.resukisu". Only the Kotlin/Java app is rebuilt; the proven
# ksud native daemon (libksud.so) is reused from an existing official APK,
# so no Rust / LKM / ksuinit build chain is needed. arm64-v8a only.

on:
  workflow_dispatch:
    inputs:
      ksu_commit:
        description: "BakaSU commit to build (must match the commit your kernel was built from)"
        required: true
        default: "63ad1ea3a90455dee9d77163cdafb028d8a90416"
      package_name:
        description: "Custom package name (leave empty to auto-generate a random one)"
        required: false
        default: ""
      app_label:
        description: "App display name"
        required: true
        default: "BakaSU"
      reference_apk_url:
        description: "Direct URL to an official BakaSU arm64-v8a (or universal) APK to source libksud.so from"
        required: true
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout BakaSU at pinned commit
        uses: actions/checkout@v7
        with:
          repository: Baka-SU/BakaSU
          ref: ${{ inputs.ksu_commit }}
          fetch-depth: 0

      - name: Resolve build parameters
        id: params
        run: |
          set -euo pipefail
          PKG="${{ inputs.package_name }}"
          if [ -z "$PKG" ]; then
            PKG="com.android.$(openssl rand -hex 6)"
            echo "Auto-generated package name: $PKG"
          fi
          case "$PKG" in
            *resukisu*)
              echo "::error::Package name must not contain 'resukisu' — that defeats the purpose."
              exit 1 ;;
          esac
          echo "PKG=$PKG" >> "$GITHUB_OUTPUT"
          echo "SHA=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          PASS="$(openssl rand -hex 24)"
          echo "::add-mask::$PASS"
          echo "PASS=$PASS" >> "$GITHUB_OUTPUT"

      - name: Fetch reference APK and extract libksud.so (arm64)
        run: |
          set -euo pipefail
          mkdir -p _ref
          curl -fL --retry 3 -o _ref/reference.apk "${{ inputs.reference_apk_url }}"
          # APK is a zip; pull the arm64 libksud.so the manager loads at runtime.
          if ! unzip -o _ref/reference.apk 'lib/arm64-v8a/libksud.so' -d _ref >/dev/null 2>&1; then
            echo "::error::lib/arm64-v8a/libksud.so not found in the reference APK. Provide a BakaSU arm64 or universal APK."
            exit 1
          fi
          mkdir -p target/aarch64-linux-android/release
          # repack looks for a file named 'ksud' at this path and injects it as libksud.so.
          cp _ref/lib/arm64-v8a/libksud.so target/aarch64-linux-android/release/ksud
          ls -l target/aarch64-linux-android/release/ksud

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android NDK, build-tools and CMake
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;30.0.16248370" "build-tools;36.1.0" "cmake;3.22.1" "platforms;android-37" >/dev/null

      - name: Generate signing keystore
        run: |
          set -euo pipefail
          keytool -genkeypair -alias spoofkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ steps.params.outputs.PASS }}" -keypass "${{ steps.params.outputs.PASS }}" \
            -dname "CN=BakaSU Manager" -storetype PKCS12 -keystore manager/key.jks
          {
            echo "KEYSTORE_FILE=key.jks"
            echo "KEYSTORE_PASSWORD=${{ steps.params.outputs.PASS }}"
            echo "KEY_ALIAS=spoofkey"
            echo "KEY_PASSWORD=${{ steps.params.outputs.PASS }}"
          } >> manager/gradle.properties

      - name: Build spoofed manager APK
        working-directory: ./manager
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --no-daemon \
            -PKSU_PACKAGE_NAME="${{ steps.params.outputs.PKG }}" \
            -PKSU_NAME="${{ inputs.app_label }}" \
            -PIS_SPOOFED_BUILD=true \
            -Pcommit="${{ steps.params.outputs.SHA }}"

      - name: Keep only the arm64 APK
        run: |
          set -euo pipefail
          OUT=manager/app/build/outputs/apk/release
          find "$OUT" -maxdepth 1 -type f -name '*.apk' ! -name '*arm64-v8a*' -delete
          echo "Remaining APKs:"; ls -l "$OUT"
          test -n "$(find "$OUT" -maxdepth 1 -type f -name '*arm64-v8a*.apk')"

      - name: Repack with libksud.so and resign
        run: |
          set -euo pipefail
          python3 repack_apk_multi.py repack \
            -b release -t release -a arm64-v8a \
            -K manager/key.jks -A spoofkey \
            -P "${{ steps.params.outputs.PASS }}" -S "${{ steps.params.outputs.PASS }}" \
            --strip
          echo "Built APK(s):"; ls -l dist/

      - name: Upload spoofed manager APK
        uses: actions/upload-artifact@v7
        with:
          name: BakaSU-spoofed-manager-arm64
          path: dist/*.apk
          if-no-files-found: error

      - name: Summary
        run: |
          echo "### Spoofed BakaSU manager built" >> "$GITHUB_STEP_SUMMARY"
          echo "- Package name: \`${{ steps.params.outputs.PKG }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- App label: ${{ inputs.app_label }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- BakaSU commit: ${{ steps.params.outputs.SHA }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- arm64-v8a only; libksud.so reused from the reference APK." >> "$GITHUB_STEP_SUMMARY"
